name: Epic
description: A shippable body of work made of Features, Tasks and Bugs (add them as sub-issues).
title: "[Epic]: "
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        An Epic is a shippable body of work. After creating it, add its Features/Tasks/Bugs as **sub-issues**,
        set Priority, Start date and Target date, and link it to its parent **Initiative**.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true for users or the studio when this Epic ships?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The pieces of work included. Convert each to a sub-issue as it is picked up.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this Epic deliberately does not cover.
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      description: Measurable signals that this Epic achieved its outcome.
    validations:
      required: true
